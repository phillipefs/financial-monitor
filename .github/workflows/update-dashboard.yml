name: Update dashboard

on:
  workflow_dispatch:
  # schedule:
  #   # GitHub cron uses UTC. Brasilia (BRT) is fixed at UTC-3 (no DST since 2019).
  #   # Runs Mon-Fri at 08:00, 12:00, 15:00, 18:00 BRT (11:00, 15:00, 18:00, 21:00 UTC).
  #   # Minutes are offset from :00 to avoid the scheduler's top-of-hour congestion.
  #   - cron: "7 11 * * 1-5"
  #   - cron: "7 15 * * 1-5"
  #   - cron: "7 18 * * 1-5"
  #   - cron: "7 21 * * 1-5"
  #   # Weekend: single run at 08:00 BRT (11:00 UTC) on Saturday and Sunday.
  #   - cron: "7 11 * * 6,0"
  push:
    branches:
      - main
      - master

permissions:
  contents: write   # commit the updated history files back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so the history commit-back can rebase safely

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            echo "Install dependencies attempt ${attempt}/3"
            if python -m pip install --upgrade pip && pip install -r requirements.txt; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1

      # snapshot_history.json and signal_history.json are versioned in the repo
      # (durable across cache eviction). The checkout above restores them; the
      # "Persist histories" step below commits the updated files after generation.

      - name: Generate dashboard
        env:
          YFINANCE_CACHE_DIR: ${{ runner.temp }}/yfinance-cache
          FM_PERSIST_HISTORY: "1"
        run: |
          for attempt in 1 2 3; do
            echo "Generate dashboard attempt ${attempt}/3"
            if python generate_dashboard.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 60))
            fi
          done
          exit 1

      - name: Persist histories
        # Commit the rolling KPI + per-asset signal histories back to the repo so
        # they survive Actions cache eviction. Never fails the job — a bad push
        # just retries next run.
        # [skip ci] + the GITHUB_TOKEN both prevent this commit from re-triggering.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage whichever history files the generator produced this run.
          for f in snapshot_history.json signal_history.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          # --cached so a brand-new (previously untracked) file counts as a change.
          if git diff --cached --quiet; then
            echo "History files unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore: update dashboard histories [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "dashboard histories pushed."
              exit 0
            fi
            echo "push failed (attempt ${attempt}/3); rebasing onto latest ${GITHUB_REF_NAME}…"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done
          echo "::warning::Could not push snapshot history after 3 attempts; will retry next run."
          exit 0

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp dashboard.html _site/dashboard.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy_1.outputs.page_url || steps.deploy_2.outputs.page_url || steps.deploy_3.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy_1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before deploy retry
        if: steps.deploy_1.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages retry 1
        id: deploy_2
        if: steps.deploy_1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before final deploy retry
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages retry 2
        id: deploy_3
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        uses: actions/deploy-pages@v5
