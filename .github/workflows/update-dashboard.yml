name: Update dashboard

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Brasilia (BRT) is fixed at UTC-3 (no DST since 2019).
    # Runs Mon-Fri at 08:00, 12:00, 15:00, 18:00 BRT (11:00, 15:00, 18:00, 21:00 UTC).
    # Minutes are offset from :00 to avoid the scheduler's top-of-hour congestion.
    - cron: "7 11 * * 1-5"
    - cron: "7 15 * * 1-5"
    - cron: "7 18 * * 1-5"
    - cron: "7 21 * * 1-5"
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            echo "Install dependencies attempt ${attempt}/3"
            if python -m pip install --upgrade pip && pip install -r requirements.txt; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - name: Restore snapshot history
        uses: actions/cache@v4
        with:
          path: snapshot_history.json
          # Unique key per run → restore always falls back to the latest
          # "fm-snapshot-" prefix, and the post-job step saves the updated file.
          key: fm-snapshot-${{ github.run_id }}
          restore-keys: |
            fm-snapshot-

      - name: Generate dashboard
        env:
          YFINANCE_CACHE_DIR: ${{ runner.temp }}/yfinance-cache
        run: |
          for attempt in 1 2 3; do
            echo "Generate dashboard attempt ${attempt}/3"
            if python generate_dashboard.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 60))
            fi
          done
          exit 1

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp dashboard.html _site/dashboard.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy_1.outputs.page_url || steps.deploy_2.outputs.page_url || steps.deploy_3.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy_1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before deploy retry
        if: steps.deploy_1.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages retry 1
        id: deploy_2
        if: steps.deploy_1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before final deploy retry
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages retry 2
        id: deploy_3
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        uses: actions/deploy-pages@v5
